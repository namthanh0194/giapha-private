name: Monthly Restore Drill

on:
  schedule:
    - cron: '0 3 1 * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: restore-drill-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  restore-drill:
    name: Encrypted backup and isolated restore
    runs-on: ubuntu-latest
    env:
      BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
      SUPABASE_DB_URL: ${{ secrets.BACKUP_SOURCE_DB_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@b579fc8c7122aa485f1d947120eaeb11ee04d312 # v2.0.0
        with:
          version: latest

      - name: Require backup secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$BACKUP_ENCRYPTION_KEY" || { echo 'BACKUP_ENCRYPTION_KEY is not configured.' >&2; exit 1; }
          test -n "$SUPABASE_DB_URL" || { echo 'BACKUP_SOURCE_DB_URL is not configured.' >&2; exit 1; }

      - name: Install PostgreSQL client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Start isolated local Supabase
        shell: bash
        run: |
          set -euo pipefail
          supabase start
          supabase db reset

      - name: Create encrypted backup from source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp/backups
          node scripts/backup-database.mjs > tmp/backups/backup-report.json

      - name: Restore only into local disposable database
        shell: bash
        run: |
          set -euo pipefail
          eval "$(supabase status -o env)"
          export RESTORE_TARGET_DB_URL="$DB_URL"
          export RESTORE_TARGET_CONFIRMATION="ISOLATED_RESTORE_ONLY"
          export PRODUCTION_DB_URL="$SUPABASE_DB_URL"
          node scripts/verify-backup.mjs > tmp/backups/verify-report.json

      - name: Run database tests against restored local database
        shell: bash
        run: |
          set -euo pipefail
          supabase test db

      - name: Publish drill report
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if test -f tmp/backups/verify-report.json; then
            {
              echo '## Monthly restore drill'
              echo
              echo '```json'
              cat tmp/backups/verify-report.json
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Stop isolated local Supabase
        if: always()
        shell: bash
        run: supabase stop --no-backup
